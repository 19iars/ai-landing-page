<!DOCTYPE html>
<html>
<head>
  <title>AI Landing Page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Smarter Shopping with AI</h1>
    <p>Discover products tailored for you</p>
    <button>Shop Now</button>
    <img src="assets/hero.jpg" alt="Hero Image">
  </section>

  <!-- Features -->
  <section class="features">
    <div class="card">Fast Delivery</div>
    <div class="card">AI Recommendations</div>
    <div class="card">Best Prices</div>
  </section>

  <!-- Product Highlight -->
  <section class="product">
    <img src="assets/product.jpg" alt="">
    <p>Featured Product Description</p>
  </section>

  <!-- Testimonials -->
  <section class="testimonials">
    <p>"Great experience!"</p>
    <p>"Very useful product!"</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 AI Landing Page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
